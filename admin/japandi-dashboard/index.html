<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japandi Dashboard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">
                <i class="bi bi-circle-fill text-primary me-2"></i>
                <span>Japandi UI</span>
            </a>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-item active">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </div>
            <div class="menu-item">
                <i class="bi bi-people"></i>
                <span>Master Data</span>
            </div>
            <div class="menu-item">
                <i class="bi bi-file-earmark-text"></i>
                <span>Transaksi</span>
            </div>
            <div class="menu-item">
                <i class="bi bi-newspaper"></i>
                <span>CMS</span>
            </div>
            <div class="menu-item">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <button class="icon-btn" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            
            <div class="navbar-search ms-3">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0" placeholder="Cari sesuatu...">
                </div>
            </div>

            <div class="navbar-actions">
                <button class="icon-btn" id="themeToggle">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
                <button class="icon-btn">
                    <i class="bi bi-bell-fill"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">3</span>
                </button>
                <div class="dropdown">
                    <button class="btn btn-light rounded-circle p-0 overflow-hidden" style="width:40px;height:40px;">
                        <img src="https://i.pravatar.cc/100" alt="User" class="img-fluid">
                    </button>
                </div>
            </div>
        </nav>

        <!-- Content Area -->
        <main class="content-area">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
                </ol>
            </nav>

            <!-- Page Title -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Selamat Datang, Admin</h1>
                <button class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Tambah Data</button>
            </div>

            <!-- Widgets Row -->
            <div class="row g-4 mb-4">
                <div class="col-xl-3 col-md-6">
                    <div class="card h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="rounded-3 d-flex align-items-center justify-content-center me-3" style="width:50px;height:50px;background:rgba(91,127,114,0.1);color:var(--primary);">
                                <i class="bi bi-people-fill fs-4"></i>
                            </div>
                            <div>
                                <p class="text-muted mb-0">Total User</p>
                                <h4 class="mb-0">1,254</h4>
                                <small class="text-success"><i class="bi bi-arrow-up"></i> 12% Bulan ini</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="rounded-3 d-flex align-items-center justify-content-center me-3" style="width:50px;height:50px;background:rgba(124,155,166,0.1);color:var(--info);">
                                <i class="bi bi-currency-dollar fs-4"></i>
                            </div>
                            <div>
                                <p class="text-muted mb-0">Revenue</p>
                                <h4 class="mb-0">Rp 45.2M</h4>
                                <small class="text-danger"><i class="bi bi-arrow-down"></i> 3% Bulan ini</small>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Tambahkan 2 card lagi serupa -->
            </div>

            <!-- Charts Row -->
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between">
                            <h5 class="mb-0">Statistik Kunjungan</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="lineChart" height="100"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Tipe Pengguna</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="doughnutChart" height="180"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        
        <!-- Footer -->
        <footer class="text-center py-3 border-top" style="background:var(--surface);">
            <small class="text-muted">&copy; 2023 Japandi Dashboard. Dibuat dengan Bootstrap 5.</small>
        </footer>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Custom JS -->
<script src="assets/js/theme.js"></script>
<script src="assets/js/sidebar.js"></script>
<script src="assets/js/chart.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
